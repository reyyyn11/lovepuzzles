<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Насколько хорошо ты меня знаешь?</title>
<style>
:root{--bg:#fff5f7;--card:#fff;--tx:#3b2a30;--mut:#8a6e76;--ac:#e8607f;--ac2:#ffd9e2;--ok:#3aa76d;--bad:#d9534f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241a1e;--card:#33242a;--tx:#fbe9ee;--mut:#c4a2ac;--ac:#ff7f9f;--ac2:#4a2e37;--ok:#5fcf93;--bad:#ff7d78}}
:root[data-theme="dark"]{--bg:#241a1e;--card:#33242a;--tx:#fbe9ee;--mut:#c4a2ac;--ac:#ff7f9f;--ac2:#4a2e37;--ok:#5fcf93;--bad:#ff7d78}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:20px 16px}
.c{width:100%;max-width:480px;background:var(--card);border-radius:24px;padding:28px 22px;box-shadow:0 8px 30px rgba(232,96,127,.15);align-self:flex-start;text-align:center}
.big{font-size:64px;margin:4px 0}
h1{font-size:24px;margin:8px 0}
p{color:var(--mut);line-height:1.5}
button{font:inherit;cursor:pointer}
.go{background:var(--ac);color:#fff;border:0;border-radius:999px;padding:14px 32px;font-size:18px;margin-top:12px}
.bar{height:6px;background:var(--ac2);border-radius:9px;margin-bottom:18px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.q{font-size:20px;font-weight:600;margin:6px 0 16px}
.o{display:block;width:100%;text-align:left;background:var(--bg);color:var(--tx);border:2px solid transparent;border-radius:14px;padding:13px 15px;margin:9px 0;font-size:16px}
.o.ok{border-color:var(--ok)}.o.no{border-color:var(--bad)}
.fb{min-height:48px;margin:10px 0;font-size:15px}
.sc{font-size:44px;font-weight:700;color:var(--ac)}
</style>
</head>
<body>
<div class="c" id="app"></div>
<script>
var NAME="Аля";
/* Формат: [вопрос, ПРАВИЛЬНЫЙ ответ, неверный1, неверный2, неверный3, комментарий]. Варианты перемешиваются сами. */
var D=[
["Кто мы с тобой?","Два котика","Два пельменя","Два дивана","Два курьера","Конечно, два котика 🐱🐱"],
["Где мы познакомились?","В школе","В очереди за шаурмой","В космосе","В лифте","В школе, с этого всё и началось 🎒"],
["Что я сказал на нашем первом свидании?","«Приветик, дай пацелую»","«Привет, ты не видела мой кошелёк?»","«Здравствуйте, я по объявлению»","«Мур»","Именно так, и ты не устояла 😘"],
["Как я ласково тебя называю?","Милая кудряшка","Моя булочка","Эй, ты","Товарищ начальник","Самая милая кудряшка на свете 🌀"],
["Мой любимый способ проводить выходные?","Лежать в обнимку","Генеральная уборка","Заполнять налоговую декларацию","Бегать марафон","Лежать в обнимку и никуда не спешить 🫶"],
["Какое место я мечтаю показать тебе?","Америку","Луну","Огород бабушки","Соседний магазин","Америка, и обязательно вместе ✈️"],
["Какая наша песня?","Свитер Марни","Гимн картошки","Звук будильника","Песня про пельмени","Это наша песня 🎶"],
["Какие фильмы мы смотрим вместе?","Все подряд, лишь бы вместе","Только один, но 50 раз","Только трейлеры","Мы вообще не смотрим, мы обнимаемся","Все подряд, главное рядом 🍿"],
["Что мы чаще всего заказываем?","Всё подряд","Только пиццу","Только суши","Ничего, мы же на диете","Всё подряд, мы не привередливые 😄"],
["Что я говорю тебе перед сном?","«Сладеньких снов, моя любимая няшка-вкусняшка»","«Ты опять забрала одеяло»","«Ещё пять минуточек»","«Выключи свет, я уже сплю»","Сладеньких снов, моя любимая 🌙"],
["Что я делаю, когда волнуюсь?","Шучу без остановки","Грызу ногти","Молчу как партизан","Ем всё в холодильнике","Шучу без остановки, и ты это знаешь 😅"],
["Что я пью по утрам?","Чай","Кофе","Энергетик","Воздух и надежду","Чай, горячий и без лишних вопросов 🍵"],
["Чего я боюсь больше всего?","Потерять тебя","Пауков","Что закончится шоколад","Опоздать","Потерять тебя. Поэтому я рядом 🤍"],
["Чего мне больше всего хочется рядом с тобой?","Няшиться","Мыть посуду","Молчать в телефоне","Играть в шахматы","Няшиться, и как можно дольше 🥰"],
["Какой мой любимый цвет?","Серый","Розовый","Ярко-оранжевый","Цвет настроения","Серый, спокойный и надёжный 🩶"],
["Что я не буду есть никогда?","Икру и креветки","Пельмени","Картошку","Шоколад","Икру и креветки, это не обсуждается 🙅"],
["Какое моё самое странное увлечение?","Коллекционировать мемы про котиков","Разводить кактусы","Собирать крышки от бутылок","Вязать носки","Мемы про котиков, это священное 😸"],
["Что делает тебя счастливой за пять секунд?","Киря","Мороженое","Новая серия","Тёплые носки","Киря, и это правда 💛"],
["Что ты всегда берёшь с собой?","Телефон","Крем для рук","Ещё одну кофту","Полсумки мелочей","Телефон, куда ж без него 📱"],
["Какая погода тебе нравится больше всего?","Солнце","Дождь","Первый снег","Ураган","Солнце, как и ты ☀️"],
["Какое у тебя любимое животное?","Котик","Собачка","Панда","Крокодил","Котик, конечно 🐈"],
["Что я чаще всего пишу тебе вечером?","«Люблю тебя»","«Ты как?»","«Скучаю»","«Мяу»","Люблю тебя, каждый вечер 💌"],
["Если бы мы были мультяшными героями, то кем?","Биба и Боба","Том и Джерри","Тимон и Пумба","Микки и Минни","Биба и Боба, идеальная пара 🎬"],
["Что я готов сделать ради твоей улыбки?","Всё что угодно","Почти ничего, я ленивый","Отдать последнюю шоколадку (подумаю)","Спеть на площади (нет)","Всё что угодно, только улыбайся 😊"],
["Какой подарок мне хочется сделать тебе больше всего?","Сюрприз, но я не скажу","Цветы","Поездку","Что-то сделанное руками","Сюрприз! Подожди и узнаешь 🎁"],
["Сколько причин я нашёл, почему люблю тебя?","100","3, и то с трудом","17","Ещё ищу","Целых 100, и это только начало 💖"],
["Закончи фразу: «Самое лучшее в нас двоих — это…»","Наша любовь","Наши мемы","Наши пельмени","Наш плед","Наша любовь 💞"]
];
var R=[
{m:.9,e:"👑",t:"Абсолютный эксперт по мне!",c:"Ты знаешь меня лучше всех на свете, и я самый счастливый котик, потому что ты рядом. Люблю тебя, Алечка!"},
{m:.7,e:"💖",t:"Почти идеально!",c:"Ты знаешь меня очень хорошо. А остальное мы выясним вместе, пока будем няшиться. Ты у меня самая лучшая!"},
{m:.45,e:"🐱",t:"Хороший результат, котик!",c:"Есть куда расти, а значит, нам нужно проводить вместе ещё больше времени. Отличный повод, правда?"},
{m:0,e:"🥹",t:"Нам нужно больше времени вместе!",c:"Ничего страшного: я всё равно обожаю тебя, милая кудряшка. Будем узнавать друг друга заново каждый день."}
];
var app=document.getElementById("app"),Q=[],i=0,s=0;
function shuf(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t}return a}
function start(){i=0;s=0;Q=D.map(function(d){return{q:d[0],c:d[1],o:shuf(d.slice(1,5)),f:d[5]}});
app.innerHTML='<div class="big">💌</div><h1>Насколько хорошо ты меня знаешь?</h1><p>'+NAME+', '+Q.length+' вопросов про нас с тобой. Готова проверить себя?</p><button class="go" onclick="show()">Начать</button>'}
function show(){
var q=Q[i];
app.innerHTML='<div class="bar"><i style="width:'+(i/Q.length*100)+'%"></i></div><p>Вопрос '+(i+1)+' из '+Q.length+'</p><div class="q">'+q.q+'</div>'+
q.o.map(function(t,k){return '<button class="o" onclick="pick('+k+')">'+t+'</button>'}).join('')+'<div class="fb" id="fb"></div>'
}
function pick(k){
var q=Q[i],bs=app.querySelectorAll(".o");
bs.forEach(function(b,n){b.disabled=true;if(q.o[n]===q.c)b.classList.add("ok");else if(n===k)b.classList.add("no")});
var good=q.o[k]===q.c;if(good)s++;
document.getElementById("fb").innerHTML=(good?"Верно! ":"Ой, не совсем. ")+q.f+'<br><button class="go" onclick="next()">'+(i===Q.length-1?"Узнать результат":"Дальше")+'</button>'
}
function next(){i++;if(i<Q.length)show();else end()}
function end(){
var r=R.find(function(x){return s/Q.length>=x.m});
app.innerHTML='<div class="big">'+r.e+'</div><div class="sc">'+s+' из '+Q.length+'</div><h1>'+r.t+'</h1><p>'+r.c+'</p><button class="go" onclick="start()">Пройти ещё раз</button>'
}
start();
</script>
</body>
</html>
